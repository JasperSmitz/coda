[package]
name = "coda-app"
version = "0.1.0"
description = "Coda: a desktop music player for local files and Navidrome"
authors = ["Jasper Smitz"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coda_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
libc = "0.2.191"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1.44"
coda-core = { path = "../../../crates/coda-core" }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tempfile = "3.27.0"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse", "display"] }
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
url = "2.5.8"
wiremock = "0.6.5"
