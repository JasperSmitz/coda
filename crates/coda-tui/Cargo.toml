[package]
name = "coda-tui"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "A keyboard-first terminal music player"
license = "MIT"
publish = false

[lib]
name = "coda_tui"
path = "src/lib.rs"

[[bin]]
name = "coda"
path = "src/main.rs"

[dependencies]
coda-core = { path = "../coda-core" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
libc = "0.2.191"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs", "signal"] }
tracing = "0.1.44"
unicode-width = "0.2.2"

[features]
# Replaces the OS credential store with an in-memory one, for pty smoke
# runs that must not touch the real keychain. Never enable in a release.
mock-secret-store = ["coda-core/mock-secret-store"]

[dev-dependencies]
# `SecretStore::mock()` for the tests' own stores. Not `mock-secret-store`:
# Cargo unifies dev-dependency features into the `coda` binary that
# `cargo test` builds (and leaves in target/), which must keep the OS
# keychain.
coda-core = { path = "../coda-core", features = ["test-util"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
url = "2.5.8"
wiremock = "0.6.5"
