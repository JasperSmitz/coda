[workspace]
resolver = "3"
members = [
    "crates/coda-tui",
    "apps/coda-gui/crates/coda-core",
    "apps/coda-gui/src-tauri",
]

# The TUI ships with the default release profile: it unwinds on panic, which
# its terminal-restoring Drop guards rely on.

# The GUI's release build (Tauri) uses this profile: its panic hook relies on
# `panic = "abort"` to take mpv down with the process.
[profile.release-gui]
inherits = "release"
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
