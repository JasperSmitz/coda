[package]
name = "coda-player"
version = "0.1.0"
edition = "2024"
description = "A keyboard-first terminal music player"
license = "MIT"
publish = false

[lib]
name = "coda_player"
path = "src/lib.rs"

[[bin]]
name = "coda"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
lofty = "0.25.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
unicode-width = "0.2.2"
walkdir = "2.5.0"
