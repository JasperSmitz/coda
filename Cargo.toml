[workspace]
resolver = "3"
members = [
    "crates/coda-tui",
    "crates/coda-core",
    "apps/coda-gui/src-tauri",
]

# Crates used by two or more members. Members add their own features
# (`{ workspace = true, features = [...] }`).
[workspace.dependencies]
coda-core = { path = "crates/coda-core" }
getrandom = "0.4.3"
# Pinned: cover art decoding (JPEG, PNG and WebP only, pure Rust, no rayon).
image = { version = "=0.25.10", default-features = false }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.44"
url = "2.5.8"
wiremock = "0.6.5"

# The TUI ships with the default release profile: it unwinds on panic, which
# its terminal-restoring Drop guards rely on.

# The GUI's release build (Tauri) uses this profile: its panic hook relies on
# `panic = "abort"` to take mpv down with the process.
[profile.release-gui]
inherits = "release"
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
