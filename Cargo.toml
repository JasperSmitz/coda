[package]
name = "coda-player"
version = "0.1.0"
edition = "2024"
description = "A keyboard-first terminal music player"
license = "MIT"
publish = false

[lib]
name = "coda_player"
path = "src/lib.rs"

[[bin]]
name = "coda"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
keyring-core = "1.0.1"
libc = "0.2.191"
lofty = "0.25.4"
md5 = "0.8.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs", "signal"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
unicode-width = "0.2.2"
url = "2.5.8"
walkdir = "2.5.0"

# OS credential store backends for `keyring-core` (ADR 0004). Only
# `src/secret_store.rs` uses them.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

# Pure-Rust D-Bus (zbus) and crypto: no libdbus headers or OpenSSL needed.
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[features]
# Replaces the OS credential store with an in-memory one, for pty smoke
# runs that must not touch the real keychain. Never enable in a release.
mock-secret-store = []

[dev-dependencies]
wiremock = "0.6.5"
