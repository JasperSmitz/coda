name: Release

# Pushing a tag such as `v1.0.0` builds Coda for Linux and macOS and
# publishes a GitHub release. See docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check version and notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - name: The tag matches Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "coda-player") | .version')
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from Cargo.toml"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The lines under `## [VERSION]` up to the next `## ` heading,
          # without link definitions and surrounding blank lines.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found && /^\[[^]]*\]: / { next }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > section.md
          # Drop trailing blank lines.
          printf '%s\n' "$(cat section.md)" > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION (expected a heading '## [$VERSION] - YYYY-MM-DD')"
            exit 1
          fi
          cat >> notes.md <<'NOTES'

          ---
          Each archive holds the `coda` binary, `LICENSE` and `README.md`; check it against its `.sha256` file. Coda needs [mpv](https://mpv.io) on `PATH`. The macOS binaries are not signed or notarised: if macOS blocks `coda`, run `xattr -d com.apple.quarantine coda` once.
          NOTES
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            native: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            native: true
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          # Built on the arm64 runner: Apple's toolchain targets both
          # architectures, and Intel macOS runners are being retired.
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache here: a release is built from a clean slate.
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Check the binary
        env:
          NATIVE: ${{ matrix.native }}
        run: |
          bin="target/$TARGET/release/coda"
          file "$bin"
          if [ "$NATIVE" = true ]; then
            out=$("$bin" --version)
            echo "$out"
            if [ "$out" != "coda $VERSION" ]; then
              echo "::error::Expected 'coda $VERSION', got '$out'"
              exit 1
            fi
          fi
      - name: Package
        run: |
          name="coda-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/coda" LICENSE README.md "dist/$name/"
          cd dist
          # No macOS extended attributes (`._` files) in the archive.
          COPYFILE_DISABLE=1 tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Verify the checksums
        working-directory: dist
        run: |
          ls -l
          archives=(./*.tar.gz)
          if [ "${#archives[@]}" -ne 4 ]; then
            echo "::error::Expected 4 archives, found ${#archives[@]}"
            exit 1
          fi
          sha256sum -c -- ./*.sha256
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Coda $VERSION" \
            --notes-file notes/notes.md \
            "${prerelease[@]}"
